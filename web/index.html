<!DOCTYPE html>
<html lang="es">
<head>
  <!-- DEV_PATCH_START -->
  <script>
    // Parche exclusivo para desarrollo local. Los builds de producción lo eliminan.
    (function() {
      const isLocalhost =
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';

      if (!isLocalhost) {
        return;
      }

      const devThemes = {
        saldify: {
          title: 'Saldify [Dev]',
          name: 'SALDIFY',
          description: 'Red de venta para gestión de créditos y saldos en línea [DEV]',
          background: 'linear-gradient(180deg, #155C37 0%, #1B5E20 26%, #0D47A1 100%)',
          bottomColor: '#0D47A1',
          logoAnimation: 'spinContinuous 4s linear infinite',
          icon: 'icons/saldify/Icon-512.png'
        },
        redventas: {
          title: 'RedVentas [Dev]',
          name: 'REDVENTAS',
          description: 'CONECTA + GESTIONA + CRECE',
          background: 'linear-gradient(160deg, #0D9488 0%, #238D82 42%, #E63946 100%)',
          bottomColor: '#B65F77',
          logoAnimation: 'fadeLogo 2.8s ease-in-out infinite',
          icon: 'icons/redventas/Icon-512.png'
        }
      };

      const requestedMode =
        new URLSearchParams(window.location.search).get('appMode') || 'saldify';
      const appMode = devThemes[requestedMode] ? requestedMode : 'saldify';
      const devTheme = devThemes[appMode];

      document.title = devTheme.title;
      document.documentElement.style.setProperty('--app-background', devTheme.background);
      document.documentElement.style.setProperty('--app-bottom-color', devTheme.bottomColor);
      document.documentElement.style.setProperty('--app-logo-animation', devTheme.logoAnimation);

      window.addEventListener('DOMContentLoaded', () => {
        const nameEl = document.querySelector('.app-name');
        const sloganEl = document.querySelector('.app-slogan');
        const iconEl = document.querySelector('.logo-container img');

        if (nameEl) nameEl.textContent = devTheme.name;
        if (sloganEl) sloganEl.textContent = devTheme.description;
        if (iconEl) {
          iconEl.src = devTheme.icon;
          iconEl.alt = devTheme.title;
        }
      });
    })();
  </script>
  <!-- DEV_PATCH_END -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="{{APP_DESCRIPTION}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta property="og:title" content="{{APP_TITLE}}">
  <meta property="og:description" content="{{APP_DESCRIPTION}}">
  <meta property="og:image" content="https://venture.jars.mx/venture_saldify/icons/Icon-512.png">
  <meta property="og:url" content="https://venture.jars.mx/venture_saldify/">

  <meta name="theme-color" content="#155C37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{APP_TITLE}}">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>{{APP_TITLE}}</title>

  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script>
    window._flutter = {
      buildConfig: {
        builds: [
          {
            renderer: 'auto',
            compileTarget: 'dart2js'
          }
        ]
      }
    };

    const serviceWorkerVersion = '{{flutter_service_worker_version}}';
  </script>
  <script src="flutter.js" defer></script>

  <style>
    :root {
      --app-background: {{APP_BACKGROUND}};
      --app-bottom-color: {{APP_BOTTOM_COLOR}};
      --app-logo-animation: {{APP_LOGO_ANIMATION}};
      --saldify-bubble: rgba(255, 255, 255, 0.10);
      --saldify-bubble-soft: rgba(255, 255, 255, 0.07);
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background-color: var(--app-bottom-color);
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background-color: var(--app-bottom-color);
      background-image: var(--app-background);
      background-repeat: no-repeat;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #flutter-host {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container,
    flt-semantics-host {
      background: transparent !important;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--app-background);
      opacity: 1;
      transition: opacity 0.5s ease-out;
      z-index: 2147483647;
      overflow: hidden;
      box-sizing: border-box;
      border-bottom: 1px solid var(--app-bottom-color);
    }

    #splash::before,
    #splash::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    #splash::before {
      width: min(52vw, 520px);
      height: min(52vw, 520px);
      right: max(-14vw, -150px);
      top: min(10vh, 110px);
      background: var(--saldify-bubble);
    }

    #splash::after {
      width: min(34vw, 340px);
      height: min(34vw, 340px);
      left: max(-12vw, -120px);
      top: 38vh;
      background: var(--saldify-bubble-soft);
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      width: min(100%, 560px);
      min-height: 696px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 28px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .splash-bubble {
      position: absolute;
      right: 8vw;
      bottom: 8vh;
      width: min(40vw, 400px);
      height: min(40vw, 400px);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 0;
    }

    .logo-container {
      width: 260px;
      height: 173px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: var(--app-logo-animation);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 430px) {
      .splash-content {
        min-height: 613px;
      }

      .logo-container {
        width: 210px;
        height: 140px;
      }
    }

    .app-name {
      color: #ffffff;
      font-size: 50px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInUp 1s ease-out forwards;
      animation-delay: 0.5s;
    }

    .app-slogan {
      color: #58D9A4;
      font-size: 18px;
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 1px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      animation-delay: 1s;
    }

    .loader {
      width: 32px;
      height: 32px;
      margin-top: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 430px) {
      .app-name {
        font-size: 38px;
      }
    }

    flutter-loader,
    flt-progress-bar,
    .flutter-loader,
    .flutter-progress,
    progress {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
    }

    @keyframes spinContinuous {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeLogo {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 1; }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="flutter-host"></div>

  <div id="splash">
    <div class="splash-bubble"></div>
    <div class="splash-content">
      <div class="logo-container">
        <img src="icons/Icon-512.png" alt="Saldify Icon">
      </div>
      <div class="app-name">{{APP_TITLE_UPPER}}</div>
      <div class="app-slogan">{{APP_DESCRIPTION}}</div>
      <div class="loader"></div>
    </div>
  </div>

  <script>
    function removeFlutterProgressBars() {
      document.querySelectorAll(
        'flutter-loader, flt-progress-bar, .flutter-loader, .flutter-progress, progress'
      ).forEach(function(element) {
        element.remove();
      });
    }

    const flutterProgressObserver = new MutationObserver(removeFlutterProgressBars);
    flutterProgressObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
    removeFlutterProgressBars();

    function hideSplash() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() {
          splash.remove();
          flutterProgressObserver.disconnect();
        }, 500);
      }
    }

    window.addEventListener('load', function() {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            setTimeout(hideSplash, 200);
          });
        }
      });
    });
  </script>
</body>
</html>

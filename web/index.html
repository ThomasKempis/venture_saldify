<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración y metadatos -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta property="og:title" content="Venture Web">
  <meta property="og:description" content="Soluciones Empresariales">
  <meta property="og:image" content="logo.png">
  <meta property="og:url" content="https://venture.jars.mx/venture">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Venture Web">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="venture">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Saldify</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Configuración _flutter.buildConfig -->
  <script>
    window._flutter = {
      buildConfig: {
        builds: [
          {
            renderer: 'auto',
            compileTarget: 'dart2js'
          }
        ]
      }
    };

    const serviceWorkerVersion = '{{flutter_service_worker_version}}';
  </script>

  <script src="flutter.js" defer></script>

  <!-- ESTILOS EXCLUSIVOS DEL SPLASH ANIMADO DE SALDIFY -->
  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1B5E20 0%, #0D47A1 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.5s ease-out;
      z-index: 2147483647;
    }

    flutter-loader,
    flt-progress-bar,
    .flutter-loader,
    .flutter-progress,
    progress {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* CAMBIO: Logo más grande (220px) y rotación infinita constante */
    .logo-container {
      width: 260px;
      height: 260px;
      margin-bottom: -44px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spinContinuous 4s linear infinite;
    }

    .logo-container img {
      width: 100%;
      height: auto;
    }

    /* Animación del Nombre (Aparece desvanecido desde abajo) */
    .app-name {
      color: #ffffff;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInUp 1s ease-out forwards;
      animation-delay: 0.5s; /* Un poco más rápido para acoplar los tiempos */
    }

    .app-slogan {
      color: #58D9A4;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      animation-delay: 1s;
    }

    /* Indicador de carga circular */
    .loader {
      margin-top: 40px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* NUEVO KEYFRAME: Rotación fluida e infinita de 0 a 360 grados */
    @keyframes spinContinuous {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
<!-- Contenedor visual de la animación inicial -->
<div id="splash">
  <div class="logo-container">
    <img src="logo.png" alt="Saldify Icon">
  </div>
  <div class="app-name">SALDIFY</div>
  <div class="app-slogan">SMART BALANCE & CREDITS CONTROL</div>
  <div class="loader"></div>
</div>

<!-- Script controlador del ciclo de vida de la carga -->
<script>
  function removeFlutterProgressBars() {
    document.querySelectorAll(
      'flutter-loader, flt-progress-bar, .flutter-loader, .flutter-progress, progress'
    ).forEach(function(element) {
      element.remove();
    });
  }

  const flutterProgressObserver = new MutationObserver(removeFlutterProgressBars);
  flutterProgressObserver.observe(document.documentElement, {
    childList: true,
    subtree: true
  });
  removeFlutterProgressBars();

  function hideSplash() {
    var splash = document.getElementById('splash');
    if (splash) {
      splash.classList.add('hidden');
      setTimeout(function() {
        splash.remove();
        flutterProgressObserver.disconnect();
      }, 500);
    }
  }

  window.addEventListener('load', function(ev) {
    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
          setTimeout(hideSplash, 200);
        });
      }
    });
  });
</script>
</body>
</html>
